name: Validate project

on:
  push:
    branches: [main, "feature/**", "develop"]
  pull_request:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required Unreal and gameplay files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            APOCALYPSE.uproject
            Source/APOCALYPSE.Target.cs
            Source/APOCALYPSEEditor.Target.cs
            Source/APOCALYPSE/APOCALYPSE.Build.cs
            Source/APOCALYPSE/APOCALYPSE.cpp
            Source/APOCALYPSE/Characters/ApocalypseCharacter.h
            Source/APOCALYPSE/Characters/ApocalypseCharacter.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseInteractable.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.cpp
            Source/APOCALYPSE/World/ApocalypseWorldTypes.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.cpp
            Source/APOCALYPSE/World/WorldRegionDefinition.h
            Source/APOCALYPSE/World/WorldRegionRegistry.h
            Source/APOCALYPSE/World/WorldEnvironmentController.h
            Source/APOCALYPSE/World/WorldPOIRegistry.h
            Source/APOCALYPSE/Tests/WorldSystemsTests.cpp
            Docs/OPEN_WORLD_PRODUCTION.md
            Docs/WORLD_CONTENT_PIPELINE.md
            Docs/SURVIVAL_GAMEPLAY.md
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("APOCALYPSE.uproject").read_text())
          assert project["EngineAssociation"] == "5.8"
          assert any(module["Name"] == "APOCALYPSE" for module in project["Modules"])
          survival = Path("Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.cpp").read_text()
          interaction = Path("Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.cpp").read_text()
          character = Path("Source/APOCALYPSE/Characters/ApocalypseCharacter.cpp").read_text()
          assert "DOREPLIFETIME" in survival and "HasAuthority" in survival
          assert "ServerTryInteract_Implementation" in interaction
          assert "Execute_CanInteract" in interaction and "Execute_Interact" in interaction
          assert "CreateDefaultSubobject<UApocalypseSurvivalComponent>" in character
          assert "CreateDefaultSubobject<UApocalypseInteractionComponent>" in character
          print("Project descriptor, survival authority/replication, and interaction integration checks passed.")
          PY
