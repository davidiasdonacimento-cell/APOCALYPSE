name: Validate project

on:
  push:
    branches: [main, "feature/**", "develop"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f APOCALYPSE.uproject
          test -f Source/APOCALYPSE.Target.cs
          test -f Source/APOCALYPSEEditor.Target.cs
          test -f Source/APOCALYPSE/APOCALYPSE.Build.cs
          test -f Source/APOCALYPSE/APOCALYPSE.cpp
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("APOCALYPSE.uproject").read_text())
          assert project["EngineAssociation"] == "5.8"
          assert any(module["Name"] == "APOCALYPSE" for module in project["Modules"])
          print("Project descriptor is valid.")
          PY
