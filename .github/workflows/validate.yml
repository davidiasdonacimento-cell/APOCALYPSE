name: Validate project

on:
  push:
    branches: [main, "feature/**", "develop"]
  pull_request:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal and gameplay source
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            APOCALYPSE.uproject
            Source/APOCALYPSE.Target.cs
            Source/APOCALYPSEEditor.Target.cs
            Source/APOCALYPSE/APOCALYPSE.Build.cs
            Source/APOCALYPSE/APOCALYPSE.cpp
            Source/APOCALYPSE/Characters/ApocalypseCharacter.h
            Source/APOCALYPSE/Characters/ApocalypseCharacter.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseInteractable.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseItemCatalog.h
            Source/APOCALYPSE/Gameplay/ApocalypseItemCatalog.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseInventoryComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseInventoryComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseEquipmentComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseEquipmentComponent.cpp
            Source/APOCALYPSE/UI/ApocalypseInventoryWidget.h
            Source/APOCALYPSE/UI/ApocalypseInventoryWidget.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseWorldPickup.h
            Source/APOCALYPSE/Gameplay/ApocalypseWorldPickup.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseResourceNode.h
            Source/APOCALYPSE/Gameplay/ApocalypseResourceNode.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseStorageContainer.h
            Source/APOCALYPSE/Gameplay/ApocalypseStorageContainer.cpp
            Source/APOCALYPSE/World/ApocalypseWorldTypes.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.cpp
            Source/APOCALYPSE/World/WorldRegionDefinition.h
            Source/APOCALYPSE/World/WorldRegionRegistry.h
            Source/APOCALYPSE/World/WorldEnvironmentController.h
            Source/APOCALYPSE/World/WorldPOIRegistry.h
            Source/APOCALYPSE/Tests/WorldSystemsTests.cpp
            Source/APOCALYPSE/Tests/InventorySystemsTests.cpp
            Source/APOCALYPSE/Tests/VeritySystemsTests.cpp
            Source/APOCALYPSE/Verity/VerityHostileTarget.h
            Source/APOCALYPSE/Verity/VerityAIController.h
            Source/APOCALYPSE/Verity/VerityAIController.cpp
            Source/APOCALYPSE/Verity/VerityCompanionAI.h
            Source/APOCALYPSE/Verity/VerityCompanionAI.cpp
            Source/APOCALYPSE/Verity/VerityCombatSystem.h
            Source/APOCALYPSE/Verity/VerityCombatSystem.cpp
            Source/APOCALYPSE/Verity/VerityDialogueSystem.h
            Source/APOCALYPSE/Verity/VerityDialogueSystem.cpp
            Source/APOCALYPSE/Verity/VerityMemorySystem.h
            Source/APOCALYPSE/Verity/VerityMemorySystem.cpp
            Source/APOCALYPSE/Verity/VerityNavigationSystem.h
            Source/APOCALYPSE/Verity/VerityNavigationSystem.cpp
            Source/APOCALYPSE/Verity/VerityPersonalitySystem.h
            Source/APOCALYPSE/Verity/VerityPersonalitySystem.cpp
            Source/APOCALYPSE/Verity/VerityVoiceSystem.h
            Source/APOCALYPSE/Verity/VerityVoiceSystem.cpp
            Source/APOCALYPSE/Verity/VerityCompanionCharacter.h
            Source/APOCALYPSE/Verity/VerityCompanionCharacter.cpp
            Source/APOCALYPSE/UI/VeritySettingsWidget.h
            Source/APOCALYPSE/UI/VeritySettingsWidget.cpp
            Backend/Verity/main.py
            Backend/Verity/requirements.txt
            Backend/Verity/Dockerfile
            Docs/OPEN_WORLD_PRODUCTION.md
            Docs/WORLD_CONTENT_PIPELINE.md
            Docs/SURVIVAL_GAMEPLAY.md
            Docs/INVENTORY_LOOT_STORAGE.md
            Docs/INVENTORY_EQUIPMENT_UI.md
            Docs/VERITY_AI_COMPANION.md
            render.yaml
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          python3 -m compileall -q Backend/Verity/main.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("APOCALYPSE.uproject").read_text())
          assert project["EngineAssociation"] == "5.8"
          assert any(module["Name"] == "APOCALYPSE" for module in project["Modules"])
          root = Path("Source/APOCALYPSE")
          build = (root / "APOCALYPSE.Build.cs").read_text()
          character = (root / "Characters/ApocalypseCharacter.cpp").read_text()
          companion = (root / "Verity/VerityCompanionCharacter.cpp").read_text()
          companion_ai = (root / "Verity/VerityCompanionAI.cpp").read_text()
          combat = (root / "Verity/VerityCombatSystem.cpp").read_text()
          navigation = (root / "Verity/VerityNavigationSystem.cpp").read_text()
          dialogue = (root / "Verity/VerityDialogueSystem.cpp").read_text()
          voice = (root / "Verity/VerityVoiceSystem.cpp").read_text()
          memory = (root / "Verity/VerityMemorySystem.cpp").read_text()
          personality = (root / "Verity/VerityPersonalitySystem.cpp").read_text()
          hostile = (root / "Verity/VerityHostileTarget.h").read_text()
          widget = (root / "UI/VeritySettingsWidget.cpp").read_text()
          verity_test = (root / "Tests/VeritySystemsTests.cpp").read_text()
          assert all(module in build for module in ('"AIModule"', '"NavigationSystem"', '"HTTP"', '"Json"'))
          assert "SpawnVerityCompanion" in character and "DOREPLIFETIME" in character
          assert "CreateDefaultSubobject<UVerityCompanionAI>" in companion
          assert "CreateDefaultSubobject<UVerityCombatSystem>" in companion
          assert "CreateDefaultSubobject<UVerityNavigationSystem>" in companion
          assert "CreateDefaultSubobject<UVerityDialogueSystem>" in companion
          assert "CreateDefaultSubobject<UVerityVoiceSystem>" in companion
          assert "VerityHostileTarget" in companion_ai and "OverlapMultiByObjectType" in companion_ai
          assert "Execute_ReceiveVerityDamage" in combat and "HasAuthority" in combat
          assert "MoveToActor" in navigation
          assert "/v1/dialogue" in dialogue and "FRandRange" in dialogue
          assert "/v1/voice" in voice and "QueueAudio" in voice
          assert "MaxMemoryEntries" in memory and "português brasileiro" in personality
          assert "BlueprintNativeEvent" in hostile
          assert "SetAutomaticConversationEnabled" in widget and "SetVoiceVolume" in widget
          assert "APOCALYPSE.Verity.SessionMemory" in verity_test
          assert "APOCALYPSE.Verity.Personality" in verity_test
          backend = Path("Backend/Verity/main.py").read_text()
          assert '@app.post("/v1/dialogue")' in backend and '@app.post("/v1/voice")' in backend
          assert "OPENAI_API_KEY" in backend and "response_format" in backend
          survival = (root / "Gameplay/ApocalypseSurvivalComponent.cpp").read_text()
          interaction = (root / "Gameplay/ApocalypseInteractionComponent.cpp").read_text()
          catalog = (root / "Gameplay/ApocalypseItemCatalog.cpp").read_text()
          inventory = (root / "Gameplay/ApocalypseInventoryComponent.cpp").read_text()
          equipment = (root / "Gameplay/ApocalypseEquipmentComponent.cpp").read_text()
          pickup = (root / "Gameplay/ApocalypseWorldPickup.cpp").read_text()
          resource = (root / "Gameplay/ApocalypseResourceNode.cpp").read_text()
          storage = (root / "Gameplay/ApocalypseStorageContainer.cpp").read_text()
          assert "DOREPLIFETIME" in survival and "HasAuthority" in survival
          assert "ServerTryInteract_Implementation" in interaction
          assert "canned_food" in catalog and "water_bottle" in catalog and "medical_kit" in catalog
          assert "DOREPLIFETIME" in inventory and "ServerTransferTo_Implementation" in inventory
          assert "ServerTransferFrom_Implementation" in inventory
          assert "ServerEquip_Implementation" in equipment and "ServerUnequip_Implementation" in equipment
          assert "AddItem(ItemId, Quantity)" in pickup and "DOREPLIFETIME" in pickup
          assert "AddItem(ResourceItemId, Requested)" in resource and "DOREPLIFETIME" in resource
          assert "NotifyStorageOpened(Inventory)" in storage
          print("Project metadata, survival, inventory, Verity companion, backend contract and integration checks passed.")
          PY
