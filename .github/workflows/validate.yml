name: Validate project

on:
  push:
    branches: [main, "feature/**", "develop"]
  pull_request:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal and gameplay source
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            APOCALYPSE.uproject
            Source/APOCALYPSE.Target.cs
            Source/APOCALYPSEEditor.Target.cs
            Source/APOCALYPSE/APOCALYPSE.Build.cs
            Source/APOCALYPSE/APOCALYPSE.cpp
            Source/APOCALYPSE/Characters/ApocalypseCharacter.h
            Source/APOCALYPSE/Characters/ApocalypseCharacter.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseSurvivalComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseInteractable.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseInteractionComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseItemCatalog.h
            Source/APOCALYPSE/Gameplay/ApocalypseItemCatalog.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseInventoryComponent.h
            Source/APOCALYPSE/Gameplay/ApocalypseInventoryComponent.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseWorldPickup.h
            Source/APOCALYPSE/Gameplay/ApocalypseWorldPickup.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseResourceNode.h
            Source/APOCALYPSE/Gameplay/ApocalypseResourceNode.cpp
            Source/APOCALYPSE/Gameplay/ApocalypseStorageContainer.h
            Source/APOCALYPSE/Gameplay/ApocalypseStorageContainer.cpp
            Source/APOCALYPSE/World/ApocalypseWorldTypes.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.h
            Source/APOCALYPSE/World/ApocalypseWorldSubsystem.cpp
            Source/APOCALYPSE/World/WorldRegionDefinition.h
            Source/APOCALYPSE/World/WorldRegionRegistry.h
            Source/APOCALYPSE/World/WorldEnvironmentController.h
            Source/APOCALYPSE/World/WorldPOIRegistry.h
            Source/APOCALYPSE/Tests/WorldSystemsTests.cpp
            Docs/OPEN_WORLD_PRODUCTION.md
            Docs/WORLD_CONTENT_PIPELINE.md
            Docs/SURVIVAL_GAMEPLAY.md
            Docs/INVENTORY_LOOT_STORAGE.md
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("APOCALYPSE.uproject").read_text())
          assert project["EngineAssociation"] == "5.8"
          assert any(module["Name"] == "APOCALYPSE" for module in project["Modules"])
          root = Path("Source/APOCALYPSE")
          survival = (root / "Gameplay/ApocalypseSurvivalComponent.cpp").read_text()
          interaction = (root / "Gameplay/ApocalypseInteractionComponent.cpp").read_text()
          catalog = (root / "Gameplay/ApocalypseItemCatalog.cpp").read_text()
          inventory = (root / "Gameplay/ApocalypseInventoryComponent.cpp").read_text()
          pickup_h = (root / "Gameplay/ApocalypseWorldPickup.h").read_text()
          pickup = (root / "Gameplay/ApocalypseWorldPickup.cpp").read_text()
          resource_h = (root / "Gameplay/ApocalypseResourceNode.h").read_text()
          resource = (root / "Gameplay/ApocalypseResourceNode.cpp").read_text()
          storage = (root / "Gameplay/ApocalypseStorageContainer.cpp").read_text()
          character = (root / "Characters/ApocalypseCharacter.cpp").read_text()
          assert "DOREPLIFETIME" in survival and "HasAuthority" in survival
          assert "ServerTryInteract_Implementation" in interaction
          assert "Execute_CanInteract" in interaction and "Execute_Interact" in interaction
          assert "canned_food" in catalog and "water_bottle" in catalog and "medical_kit" in catalog
          assert "DOREPLIFETIME" in inventory and "ServerTransferTo_Implementation" in inventory
          assert "ClientNotifyStorageOpened_Implementation" in inventory
          assert "AddItem(ItemId, Quantity)" in pickup and "DOREPLIFETIME" in pickup
          assert "AddItem(ResourceItemId, Requested)" in resource and "DOREPLIFETIME" in resource
          assert "NotifyStorageOpened(Inventory)" in storage
          assert "CreateDefaultSubobject<UApocalypseSurvivalComponent>" in character
          assert "CreateDefaultSubobject<UApocalypseInteractionComponent>" in character
          assert "CreateDefaultSubobject<UApocalypseInventoryComponent>" in character
          assert "Replicated" in pickup_h and "Replicated" in resource_h
          print("Project descriptor, authority, item catalog, inventory replication, loot, storage RPC and character integration checks passed.")
          PY
